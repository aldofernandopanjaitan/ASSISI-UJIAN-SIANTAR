<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioskop Aldo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        
        /* Layar Login */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-blue { background: #1e90ff; color: white; border: none; padding: 10px 20px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        
        /* Header Utama */
        .header { background: #2c3e50; color: white; text-align: center; padding: 20px; }
        .header h1 { margin: 0; font-size: 28px; }
        .header p { margin: 5px 0 0; color: #bdc3c7; }
        
        /* Daftar Film */
        .film-container { max-width: 800px; margin: 20px auto; }
        .film-card { background: white; margin-bottom: 15px; padding: 15px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; }
        .film-info { flex-grow: 1; margin-left: 20px; }
        .film-info h2 { margin: 0 0 5px; font-size: 18px; }
        .film-info p { margin: 2px 0; font-size: 14px; color: #555; }
        .film-info .harga { color: #27ae60; font-weight: bold; }
        .film-img { width: 100px; height: 140px; background: #333; color: white; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; }
        
        /* Footer/Navigasi */
        .footer { text-align: center; margin: 20px; padding-bottom: 20px; }
        .btn-green { background: #2ecc71; color: white; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-gray { background: #ccc; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
        
        /* Layar Nonton */
        #playback-screen { text-align: center; background: #000; color: white; height: 100vh; padding-top: 20px; }
        iframe { width: 80%; height: 60vh; border: none; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- 1. HALAMAN LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>LOGIN BIOSKOP ALDO</h2>
            <input type="text" id="username" placeholder="Username (aldo)">
            <input type="password" id="password" placeholder="Password (aldo123)">
            <button class="btn-blue" onclick="login()">MASUK</button>
        </div>
    </div>

    <!-- 2. HALAMAN UTAMA (PILIH FILM) -->
    <div id="main-screen" class="hidden">
        <div class="header">
            <h1>BIOSKOP ALDO</h1>
            <p id="tanggal-hari-ini"></p>
        </div>
        <div class="film-container" id="film-list">
            <!-- Film dirender lewat JavaScript -->
        </div>
        <div class="footer">
            <button class="btn-gray" onclick="logout()">KEMBALI</button>
            <button class="btn-gray" onclick="resetPesanan()">HAPUS PESANAN</button>
            <button class="btn-green" onclick="lanjutBayar()">TAMBAH PESANAN & BAYAR</button>
        </div>
    </div>

    <!-- 3. HALAMAN NONTON -->
    <div id="playback-screen" class="hidden">
        <h2 id="now-playing">SEDANG MEMUTAR FILM...</h2>
        <div id="video-container"></div>
        <br><br>
        <button class="btn-gray" onclick="kembaliKeMenu()">KEMBALI KE LAYAR UTAMA</button>
    </div>

    <script>
        // Data Film & Link YouTube
        const films = [
            { nama: "Avatar: The Way of Water", genre: "Sci-Fi / Action", harga: 55000, rilis: "08 November 2026", link: "https://www.youtube.com/embed/LU5nxqxucWY?autoplay=1" },
            { nama: "John Wick 4", genre: "Action / Crime", harga: 50000, rilis: "03 November 2026", link: "https://www.youtube.com/embed/ZsILQqRpMp0?autoplay=1" },
            { nama: "Transformers: Rise", genre: "Action / Mecha", harga: 45000, rilis: "29 Oktober 2026", link: "https://www.youtube.com/embed/Gh44m59Jolc?autoplay=1" }
        ];

        // Set Tanggal Otomatis
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        document.getElementById('tanggal-hari-ini').innerText = "Tanggal Hari Ini: " + new Date().toLocaleDateString('id-ID', options);

        function renderFilms() {
            const container = document.getElementById("film-list");
            container.innerHTML = "";
            films.forEach((film, index) => {
                container.innerHTML += `
                    <div class="film-card">
                        <div class="film-img">GAMBAR<br>${film.nama}</div>
                        <div class="film-info">
                            <h2>${film.nama}</h2>
                            <p>Genre: ${film.genre}</p>
                            <p>Rilis: ${film.rilis}</p>
                            <p class="harga">Harga: Rp ${film.harga}</p>
                        </div>
                        <div>
                            Pesan Tiket: <input type="number" id="qty-${index}" min="0" max="10" value="0" style="width:50px;">
                        </div>
                    </div>
                `;
            });
        }

        // Fungsi Login
        function login() {
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            if (user === "aldo" && pass === "aldo123") {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("main-screen").classList.remove("hidden");
                renderFilms();
            } else {
                alert("Username atau Password Salah!");
            }
        }

        function logout() {
            document.getElementById("main-screen").classList.add("hidden");
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("username").value = "";
            document.getElementById("password").value = "";
        }

        function resetPesanan() {
            films.forEach((_, index) => document.getElementById(`qty-${index}`).value = 0);
            alert("Semua pesanan dihapus!");
        }

        // Fungsi Bayar & Putar Video
        function lanjutBayar() {
            let total = 0;
            let filmDipilih = null;

            // Cari film pertama yang dipesan untuk diputar
            films.forEach((film, index) => {
                let qty = parseInt(document.getElementById(`qty-${index}`).value);
                if (qty > 0) {
                    total += (qty * film.harga);
                    if (!filmDipilih) filmDipilih = film; // Putar film yang pertama diceklis
                }
            });

            if (total === 0) {
                alert("Pilih minimal 1 film terlebih dahulu!");
                return;
            }

            let metode = prompt(`Total Bayar: Rp ${total}\nKetik metode (Contoh: DANA QR / BCA):`, "DANA QR");
            if (metode) {
                alert(`Pembayaran berhasil menggunakan ${metode}! Selamat Menonton.`);
                putarFilm(filmDipilih);
            }
        }

        function putarFilm(film) {
            document.getElementById("main-screen").classList.add("hidden");
            document.getElementById("playback-screen").classList.remove("hidden");
            
            document.getElementById("now-playing").innerText = `SEDANG MEMUTAR: ${film.nama}`;
            document.getElementById("video-container").innerHTML = `
                <iframe src="${film.link}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
        }

        function kembaliKeMenu() {
            document.getElementById("playback-screen").classList.add("hidden");
            document.getElementById("video-container").innerHTML = ""; // Stop video
            document.getElementById("main-screen").classList.remove("hidden");
            resetPesanan();
        }
    </script>
</body>
</html>
